# Value-constraint parsing corpus.
#
# GENERATED by scripts/build_value_constraint_corpus.py - do not hand-edit.
# Every `source_text` is lifted verbatim from data/nct_cache/ (or the cited paper);
# ClinicalTrials.gov escapes comparators as '\>' '\<' '=\>' '=\<' and those escapes
# are preserved deliberately - they are real parser input.
#
# kinds:
#   absolute_with_unit          value + unit that resolves to a standard UCUM Unit concept
#   absolute_no_unit            value with no meaningful unit (INR, indices, counts)
#   uln_multiple                multiple of the upper limit of normal -> Circe RangeHighRatio
#   lln_multiple                multiple of the lower limit of normal -> Circe RangeLowRatio
#   absolute_unresolvable_unit  value + unit text with no standard UCUM Unit concept
#   not_a_constraint            a threshold-shaped number that must NOT become a constraint
#
# Unit-resolution policy for absolute_unresolvable_unit: emit ValueAsNumber and leave Unit
# UNSET. Do not fall back to a 'nearest' concept - an incorrect Unit filter matches no rows,
# which is the same silent-zero failure mode as defect #10, only harder to spot.
#
# unit_concept_id values were resolved against synthea_cdm_benchmark.concept
# (domain_id='Unit', vocabulary_id='UCUM', standard_concept='S') on 2026-07-28.
# Three lookups that are easy to get wrong (U/L has no corpus entry - ALT/AST are
# reported in U/L but no protocol in the corpus states an absolute U/L threshold):
#   mL/min/1.73 m2 -> 720870 (code 'mL/min/(173.10*-2.m2)'). Codes 'mL/min/1.73.m2' (9117)
#     and 'mL/min/{1.73}m' (9062) exist but carry invalid_reason='U'.
#   U/L            -> 8645   (code '[U]/L'). The literal code 'U/L' is SNOMED 4118000,
#     non-standard.
#   year           -> 9448   (code 'a'). Looking up by the code 'year' finds nothing.

