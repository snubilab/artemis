      reference_bound: "absolute"
      unit_text: "kg/m²"
      unit_concept_id: 9531
      note: "The IR stores both 'kg/m2' and 'kg/m²'; UNIT_MAP has only the ASCII spelling."
  - id: neg-stat-upper-boundary
    source: paper:NCT01131676/NEJMoa1504720.pdf
    source_text: "the primary outcome was determined if the upper boundary of the two-sided 95.02% confidence interval was less than 1.3"
    threshold_phrase: "upper boundary of the two-sided 95.02% confidence interval was less than 1.3"
    expect:
      kind: "not_a_constraint"
      note: "A statistical decision rule. 'upper boundary ... less than 1.3' looks exactly like a lab threshold and is the highest-risk false positive in the whole corpus."
  - id: neg-stat-margin
    source: paper:NCT01131676/NEJMoa1504720.pdf
    source_text: "the test of noninferiority for the primary outcome with a margin of 1.3 at a one-sided level of 0.025"
    threshold_phrase: "margin of 1.3"
    expect:
      kind: "not_a_constraint"
      note: "A noninferiority margin on a hazard ratio, not an eligibility threshold."
  - id: neg-stat-ci-hr
    source: paper:NCT01179048/NEJMoa1603827.pdf
    source_text: "with a margin of 1.30 for the upper boundary of the 95% confidence interval of the hazard ratio"
    threshold_phrase: "1.30 for the upper boundary of the 95% confidence interval"
    expect:
      kind: "not_a_constraint"
      note: "Hazard-ratio bound. 'upper boundary' shares surface form with 'upper limit of normal'."
  - id: neg-stat-alpha
    source: paper:NCT01730534/NEJMoa1812389.pdf
    source_text: "each at a two-sided alpha level of 0.05"
    threshold_phrase: "two-sided alpha level of 0.05"
    expect:
      kind: "not_a_constraint"
