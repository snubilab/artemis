  - id: neg-stat-mace-ci
    source: paper:NCT01730534/NEJMoa1812389.pdf
    source_text: "criterion for noninferiority to placebo with respect to MACE (upper boundary of the 95% confidence interval [CI], <1.30)"
    threshold_phrase: "upper boundary of the 95% confidence interval [CI], <1.30"
    expect:
      kind: "not_a_constraint"
      note: "Comparator plus number plus 'upper ... of' - a greedy parser reads it as an exclusion."
