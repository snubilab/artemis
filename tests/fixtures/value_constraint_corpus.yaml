      note: "Washout window before dosing. Differs from neg-blood-donation-window only in the time unit, which is why both must be negatives."
  - id: neg-hiv-duration
    source: NCT04826341
    source_text: "HIV positive participants with the following exception: Patients with long-standing (\\>5 years) HIV on antiretroviral therapy \\> 1 month (undetectable HIV viral load and CD4 count \\> 150 cells/microL) may be eligible if the principal investigator determines no anticipated clinically significant drug-drug interactions."
    threshold_phrase: "(\\>5 years)"
    expect:
      kind: "not_a_constraint"
      note: "Duration of a condition, not a measured value."
  - id: neg-24h-collection
    source: NCT04939662
    source_text: "Proteinuria, as demonstrated by urine dipstick or \\> 1.0 g of protein in a 24-hour urine collection All subjects with ≥ 2 + protein on dipstick urinalysis at baseline must undergo a 24 hour urine collection and must demonstrate ≤ 1 g of protein in 24 hours."
    threshold_phrase: "24-hour urine collection"
    expect:
      kind: "not_a_constraint"
      note: "'24-hour' names the collection protocol; only the '> 1.0 g' is a threshold."
  - id: neg-prior-lines-count
    source: NCT05541328
    source_text: "AND has abstracted diagnosis date of DLBCL on or after January 1, 2011 AND received at least three lines of therapy AND received rituximab AND received anthracycline/anthracenedione AND has at least one 3L+ with prior exposure to rituximab and prior exposure to at least one anthracycline/anthracenedione AND at least 18 years old at index line start AND did not receive a clinical study drug in or prior to the earliest eligible 3L+ line (this represented Flatiron data delivered as part of the 3L + DLBCL Spotlight study) AND with at least 180 days of potential follow-up from index date to Flatiron data cutoff AND relapsed or refractory disease after ≥ 1 lines of therapy AND with ECOG performance status of 0-1 (or missing) within 30 days prior to the index date AND with adequate renal function defined as: serum creatinine of ≤ 1.5 x ULN or eGFR ≥ 60 mL/min/1.73 m2 (or missing) AND with adequate liver function defined as: ALT ≤ 5 x ULN and bilirubin ≤ 2.0 mg/dl (or missing) AND with adequate bone marrow reserve defined as: ANC \\> 1,000/mm3 and ALC ≥ 300/mm3 and platelets ≥ 50,000/mm3 and hemoglobin \\> 8.0 g/dl (or missing) AND confirmation of index line of therapy via abstraction."
    threshold_phrase: "at least three lines of therapy"
    expect:
      kind: "not_a_constraint"
      note: "Spelled-out count with no digits; must not be coerced into a numeric constraint."
  - id: neg-gilbert-carveout
    source: NCT04905316
    source_text: "Serum bilirubin ≤1.5 x institutional upper limit of normal (ULN). This will not apply to patients with confirmed Gilbert's syndrome (persistent or recurrent hyperbilirubinemia that is predominantly unconjugated in the absence of hemolysis or hepatic pathology), who will be allowed only in consultation with their physician."
    threshold_phrase: "This will not apply to patients with confirmed Gilbert's syndrome"
    expect:
      kind: "not_a_constraint"
      note: "A carve-out clause attached to a real threshold; contains no threshold of its own."
  - id: abs-mv-st-elevation
    source: ir:NCT00391872
    source_text: "ST-segment elevation of at least 0.1 mV in two contiguous leads"
    threshold_phrase: "at least 0.1 mV"
    expect:
      kind: "absolute_with_unit"
      op: "gte"
      value: 0.1
      reference_bound: "absolute"
      unit_text: "mV"
      unit_concept_id: 720843
      note: "Millivolt is 720843. Absent from src/agents/agent3/mappings.py UNIT_MAP entirely."
  - id: abs-ngl-calcitonin
    source: ir:NCT01179048
    source_text: "Calcitonin ≥50 ng/L"
    threshold_phrase: "≥50 ng/L"
    expect:
      kind: "absolute_with_unit"
      op: "gte"
      value: 50.0
      reference_bound: "absolute"
      unit_text: "ng/L"
      unit_concept_id: 8725
