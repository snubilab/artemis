[tool.poetry]
name = "telos-3-1"
version = "3.1.0"
description = "End-to-End Automated Clinical Evidence Generation System"
authors = ["Telos Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"

# Core
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
requests = "^2.31"
structlog = "^23.0"

# API
fastapi = "^0.109"
uvicorn = "^0.27"
httpx = "<0.28"

# Database
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
redis = "^5.0"
neo4j = "^5.28"

# Vector DB
chromadb = "^1.5"
python-multipart = ">=0.0.7"

# MedCPT Embedding (optional — install for ablation with biomedical embeddings)
transformers = {version = "^4.35", optional = true}
torch = {version = "^2.0", optional = true}

# Spark (required for Spark-based cohort generation)
pyspark = "^3.5"
pyarrow = ">=14.0"

# LLM
langchain = "^0.1.0"
langchain-core = "^0.1.0"
langchain-openai = "^0.1.7"
langgraph = "^0.0.28"
openai = "^1.0"

# Analysis
pandas = "^2.0"
numpy = "^1.24"
scikit-learn = "^1.3"
lifelines = "^0.30"

# Visualization
matplotlib = "^3.8"

# Reporting
jinja2 = "^3.1"
weasyprint = "^60.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
black = "^23.0"
ruff = "^0.1"
mypy = "^1.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker infrastructure (WebAPI, PostgreSQL, Neo4j)",
    "billed: issues a live paid LLM call; excluded by default, run with -m billed",
]
# "integration" stays in the default run -- the Docker stack is normally up and
# those tests are cheap. "billed" does not: one test in
# test_parse_criteria_items.py was calling OpenAI on every suite run, both
# spending money and failing nondeterministically because its assertion was
# about the model's output rather than the parser's.
addopts = "-m 'not billed'"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Top-level `select` was deprecated; ruff 0.16 warns on every invocation until it moves
# here. Rule set unchanged.
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
