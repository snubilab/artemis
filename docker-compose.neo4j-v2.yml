version: '3.8'

services:
  neo4j-v2:
    image: neo4j:5-community
    container_name: artemis-neo4j-v2
    environment:
      - NEO4J_AUTH=neo4j/artemis_neo4j
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512M
    volumes:
      - neo4j_v2_data:/data
      - neo4j_v2_import:/var/lib/neo4j/import
    ports:
      - "7475:7474"  # Browser
      - "7688:7687"  # Bolt
    networks:
      - default
      - broadsea_default
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  neo4j_v2_data:
  neo4j_v2_import:

networks:
  broadsea_default:
    external: true
