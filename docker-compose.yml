version: '3.8'

services:
  # PostgreSQL with OMOP CDM
  postgres:
    image: postgres:15
    container_name: artemis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artemis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artemis_pass}
      POSTGRES_DB: ${POSTGRES_DB:-omop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artemis}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for State Management & Registry
  redis:
    image: redis:7-alpine
    container_name: artemis-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB for Vector Search
  chromadb:
    image: chromadb/chroma:latest
    container_name: artemis-chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # Neo4j for OMOP Knowledge Graph (KG-RAG)
  neo4j:
    image: neo4j:5-community
    container_name: artemis-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-artemis_neo4j}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512M
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ARTEMIS API Server (for development)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artemis-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-artemis}:${POSTGRES_PASSWORD:-artemis_pass}@postgres:5432/${POSTGRES_DB:-omop}
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chromadb:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-artemis_neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  neo4j_data:
  neo4j_import:
